<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="kordoc 설치 세 가지"><title>kordoc 설치 세 가지</title><rect width="900" height="380" rx="14" fill="#231c17"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2a33a"/></marker></defs><text x="30" y="38" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="20" fill="#f2a33a" font-weight="700" text-anchor="start">설치는 세 갈래. 먼저 Node.js 20 이상 하나만 있으면 된다</text><rect x="30" y="58" width="840" height="40" rx="10" fill="#3a2e25" stroke="#4a3d32" stroke-width="1.5"/><text x="450" y="84" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" fill="#efe4cf" font-weight="500" text-anchor="middle">터미널에서 node -v 를 입력해 v20 이상이 나오는지 확인</text><rect x="30" y="124" width="270" height="196" rx="10" fill="#2f2620" stroke="#4a3d32" stroke-width="1.5"/><text x="48" y="154" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="17" fill="#f2a33a" font-weight="700" text-anchor="start">① 그냥 써 보기</text><text x="48" y="176" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" fill="#b3a28a" font-weight="400" text-anchor="start">설치 없음</text><rect x="44" y="190" width="242" height="68" rx="8" fill="#231c17" stroke="#4a3d32" stroke-width="1.5"/><text x="56" y="214" font-family="'SFMono-Regular',Menlo,Consolas,'Apple SD Gothic Neo',monospace" font-size="13.5" fill="#f2cc4d" font-weight="400" text-anchor="start">npx kordoc 문서.hwpx</text><text x="56" y="238" font-family="'SFMono-Regular',Menlo,Consolas,'Apple SD Gothic Neo',monospace" font-size="13.5" fill="#f2cc4d" font-weight="400" text-anchor="start">      -o 문서.md</text><text x="48" y="300" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" fill="#efe4cf" font-weight="400" text-anchor="start">파일 한 건 변환할 때</text><rect x="315" y="124" width="270" height="196" rx="10" fill="#2f2620" stroke="#4a3d32" stroke-width="1.5"/><text x="333" y="154" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="17" fill="#f2a33a" font-weight="700" text-anchor="start">② 내 폴더에 설치</text><text x="333" y="176" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" fill="#b3a28a" font-weight="400" text-anchor="start">프로젝트에 추가</text><rect x="329" y="190" width="242" height="42" rx="8" fill="#231c17" stroke="#4a3d32" stroke-width="1.5"/><text x="341" y="214" font-family="'SFMono-Regular',Menlo,Consolas,'Apple SD Gothic Neo',monospace" font-size="13.5" fill="#f2cc4d" font-weight="400" text-anchor="start">npm install kordoc</text><text x="333" y="300" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" fill="#efe4cf" font-weight="400" text-anchor="start">코드에서 불러 쓸 때</text><rect x="600" y="124" width="270" height="196" rx="10" fill="#2f2620" stroke="#4a3d32" stroke-width="1.5"/><text x="618" y="154" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="17" fill="#f2a33a" font-weight="700" text-anchor="start">③ AI에 연결</text><text x="618" y="176" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" fill="#b3a28a" font-weight="400" text-anchor="start">MCP 등록</text><rect x="614" y="190" width="242" height="42" rx="8" fill="#231c17" stroke="#4a3d32" stroke-width="1.5"/><text x="626" y="214" font-family="'SFMono-Regular',Menlo,Consolas,'Apple SD Gothic Neo',monospace" font-size="13.5" fill="#f2cc4d" font-weight="400" text-anchor="start">npx -y kordoc setup</text><text x="618" y="300" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" fill="#efe4cf" font-weight="400" text-anchor="start">클로드가 직접 읽게 할 때</text><text x="450" y="358" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" fill="#b3a28a" font-weight="400" text-anchor="middle">처음 실행할 때는 내려받느라 몇 초 더 걸립니다</text></svg>