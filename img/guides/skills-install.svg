<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="스킬 설치 방법 두 가지"><title>스킬 설치 방법 두 가지</title><rect width="900" height="380" rx="14" fill="#231c17"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2a33a"/></marker></defs><text x="30" y="38" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="20" fill="#f2a33a" font-weight="700" text-anchor="start">설치는 쓰는 곳에 따라 둘로 갈린다</text><rect x="30" y="66" width="410" height="262" rx="10" fill="#2f2620" stroke="#4a3d32" stroke-width="1.5"/><text x="50" y="98" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="17" fill="#f2a33a" font-weight="700" text-anchor="start">claude.ai (유료 플랜)</text><text x="50" y="122" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" fill="#f2cc4d" font-weight="500" text-anchor="start">설치 없음</text><text x="50" y="160" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13.5" fill="#efe4cf" font-weight="400" text-anchor="start">이 스킬들이 이미 들어 있습니다.</text><text x="50" y="184" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13.5" fill="#efe4cf" font-weight="400" text-anchor="start">새 대화에서 바로 말로 시키면 됩니다.</text><rect x="50" y="214" width="370" height="52" rx="8" fill="#231c17" stroke="#4a3d32" stroke-width="1.5"/><text x="66" y="246" font-family="'SFMono-Regular',Menlo,Consolas,'Apple SD Gothic Neo',monospace" font-size="14" fill="#f2cc4d" font-weight="400" text-anchor="start">“워드 파일로 만들어 줘”</text><text x="50" y="300" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" fill="#b3a28a" font-weight="400" text-anchor="start">무료 플랜은 README에 해당 안내가 없습니다</text><rect x="460" y="66" width="410" height="262" rx="14" fill="#3a2e25" stroke="#f2a33a" stroke-width="2.5"/><text x="480" y="98" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="17" fill="#f2a33a" font-weight="700" text-anchor="start">클로드 코드</text><text x="480" y="122" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" fill="#f2cc4d" font-weight="500" text-anchor="start">명령 두 줄</text><rect x="480" y="140" width="370" height="34" rx="8" fill="#231c17" stroke="#4a3d32" stroke-width="1.5"/><text x="494" y="162" font-family="'SFMono-Regular',Menlo,Consolas,'Apple SD Gothic Neo',monospace" font-size="12.5" fill="#f2cc4d" font-weight="400" text-anchor="start">/plugin marketplace add anthropics/skills</text><rect x="480" y="184" width="370" height="58" rx="8" fill="#231c17" stroke="#4a3d32" stroke-width="1.5"/><text x="494" y="206" font-family="'SFMono-Regular',Menlo,Consolas,'Apple SD Gothic Neo',monospace" font-size="12.5" fill="#f2cc4d" font-weight="400" text-anchor="start">/plugin install</text><text x="494" y="228" font-family="'SFMono-Regular',Menlo,Consolas,'Apple SD Gothic Neo',monospace" font-size="12.5" fill="#f2cc4d" font-weight="400" text-anchor="start">document-skills@anthropic-agent-skills</text><text x="480" y="272" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13.5" fill="#efe4cf" font-weight="400" text-anchor="start">설치한 뒤 앱을 다시 켜고, 요청에</text><text x="480" y="294" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13.5" fill="#efe4cf" font-weight="400" text-anchor="start">“워드 스킬로”처럼 이름을 적어 주세요</text><text x="450" y="360" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13" fill="#b3a28a" font-weight="400" text-anchor="middle">document-skills는 워드·엑셀·PDF·발표자료 네 가지 묶음입니다</text></svg>