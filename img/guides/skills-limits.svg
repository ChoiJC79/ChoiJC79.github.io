<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="문서 스킬의 한계와 kordoc과의 짝"><title>문서 스킬의 한계와 kordoc과의 짝</title><rect width="900" height="380" rx="14" fill="#231c17"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2a33a"/></marker></defs><text x="30" y="38" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="20" fill="#f2a33a" font-weight="700" text-anchor="start">한계: 워드·엑셀·PDF는 되고, 한글(HWP)은 안 된다</text><rect x="30" y="66" width="410" height="230" rx="10" fill="#2f2620" stroke="#4a3d32" stroke-width="1.5"/><text x="50" y="98" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="16" fill="#f2a33a" font-weight="700" text-anchor="start">이 스킬로 되는 것</text><text x="50" y="134" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" fill="#efe4cf" font-weight="400" text-anchor="start">✔  워드 .docx 만들기·고치기</text><text x="50" y="168" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" fill="#efe4cf" font-weight="400" text-anchor="start">✔  엑셀 .xlsx 표·수식 만들기</text><text x="50" y="202" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" fill="#efe4cf" font-weight="400" text-anchor="start">✔  PDF 읽기·합치기·나누기</text><text x="50" y="236" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" fill="#efe4cf" font-weight="400" text-anchor="start">✔  발표자료 .pptx (이번에 시험 안 함)</text><rect x="460" y="66" width="410" height="230" rx="14" fill="#3a2e25" stroke="#e2603f" stroke-width="2.5"/><text x="480" y="98" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="16" fill="#e2603f" font-weight="700" text-anchor="start">한글(HWP)이 필요하면</text><text x="480" y="134" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13.5" fill="#efe4cf" font-weight="400" text-anchor="start">스킬은 .hwp를 읽거나 만들지 못합니다</text><text x="480" y="160" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="13.5" fill="#efe4cf" font-weight="400" text-anchor="start">앞서 소개한 kordoc을 짝으로 쓰세요</text><rect x="480" y="184" width="370" height="34" rx="8" fill="#231c17" stroke="#4a3d32" stroke-width="1.5"/><text x="494" y="206" font-family="'SFMono-Regular',Menlo,Consolas,'Apple SD Gothic Neo',monospace" font-size="12.5" fill="#f2cc4d" font-weight="400" text-anchor="start">npx kordoc 문서.hwp -o 문서.md</text><rect x="480" y="228" width="370" height="34" rx="8" fill="#231c17" stroke="#4a3d32" stroke-width="1.5"/><text x="494" y="250" font-family="'SFMono-Regular',Menlo,Consolas,'Apple SD Gothic Neo',monospace" font-size="12.5" fill="#f2cc4d" font-weight="400" text-anchor="start">npx kordoc generate 보고서.md -o 보고서.hwpx</text><text x="450" y="334" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" fill="#efe4cf" font-weight="500" text-anchor="middle">한글 파일 읽기와 쓰기는 kordoc, 워드·엑셀·PDF는 이 스킬</text><text x="450" y="360" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12.5" fill="#b3a28a" font-weight="400" text-anchor="middle">둘을 같이 쓰면 공문서 업무 대부분이 닫힙니다</text></svg>