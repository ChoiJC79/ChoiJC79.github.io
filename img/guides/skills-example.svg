<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="워드 스킬로 실제 만든 보고서"><title>워드 스킬로 실제 만든 보고서</title><rect width="900" height="380" rx="14" fill="#231c17"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f2a33a"/></marker></defs><text x="30" y="38" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="20" fill="#f2a33a" font-weight="700" text-anchor="start">실제로 만들어 본 결과: 보고서.docx (파일 내용 그대로)</text><rect x="30" y="60" width="300" height="290" rx="10" fill="#2f2620" stroke="#4a3d32" stroke-width="1.5"/><text x="48" y="90" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="14" fill="#f2a33a" font-weight="700" text-anchor="start">내가 보낸 요청</text><text x="48" y="120" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12.5" fill="#efe4cf" font-weight="400" text-anchor="start">워드 스킬로 아래 내용을 A4</text><text x="48" y="144" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12.5" fill="#efe4cf" font-weight="400" text-anchor="start">한 장 현황 보고서로 만들어 줘.</text><text x="48" y="168" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12.5" fill="#efe4cf" font-weight="400" text-anchor="start">제목, 표 하나, 향후 일정 순서로.</text><text x="48" y="192" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12.5" fill="#efe4cf" font-weight="400" text-anchor="start">숫자는 내가 준 것만 써.</text><text x="48" y="236" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12.5" fill="#b3a28a" font-weight="400" text-anchor="start">사용된 스킬</text><text x="48" y="258" font-family="'SFMono-Regular',Menlo,Consolas,'Apple SD Gothic Neo',monospace" font-size="13" fill="#f2cc4d" font-weight="500" text-anchor="start">document-skills:docx</text><text 