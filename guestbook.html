<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방명록 | 최승환</title>
<meta name="description" content="최승환의 홈페이지 방명록. 누구나 자유롭게 글을 남겨주세요.">
<meta property="og:title" content="방명록 | 최승환">
<meta property="og:description" content="최승환의 홈페이지 방명록. 자유롭게 인사 남겨주세요.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://choijc79.github.io/guestbook.html">
<meta property="og:site_name" content="최승환 · Jecheon">
<meta name="twitter:card" content="summary">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #F4F0E8;
  --surface: #ECE8DE;
  --border:  #D4CEBC;
  --text:    #1A1410;
  --ink:     #2A2018;
  --muted:   #7A6A56;
  --accent:  #E07828;
  --red:     #D96820;
  --light:   #FDFAF4;
  --amber:   #E07828;
  --green:   #5A7A3A;
  --lake:    #E07828;
  --purple:  #7A4AB0;
}
[data-theme="dark"] {
  --bg:      #0d1117;
  --surface: #161b22;
  --border:  #2c3240;
  --text:    #E8E0D0;
  --ink:     #F0E8D8;
  --muted:   #8b8070;
  --accent:  #F08840;
  --red:     #E07830;
  --light:   #161b22;
  --amber:   #F08840;
  --green:   #3fb950;
  --lake:    #F08840;
  --purple:  #bc8cff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-weight:300;line-height:1.8;}
a{color:var(--accent);text-decoration:none;}
.site-header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:52px;transition:background 0.3s,border-color 0.3s;}
.logo{font-family:'Noto Serif KR',serif;font-size:15px;color:var(--accent);letter-spacing:0.04em;}
.nav-links{display:flex;gap:1.5rem;font-size:12px;}
.nav-links a{color:var(--muted);text-decoration:none;transition:color 0.15s;}
.nav-links a:hover{color:var(--accent);}
#theme-toggle{background:none;border:1px solid var(--border);color:var(--muted);font-size:11px;padding:3px 11px;border-radius:20px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;letter-spacing:0.05em;transition:all 0.2s;margin-left:1rem;}
#theme-toggle:hover{border-color:var(--accent);color:var(--accent);}
.hero{max-width:760px;margin:0 auto;padding:4rem 2rem 2rem;border-bottom:1px solid var(--border);}
.hero-label{font-size:11px;letter-spacing:0.12em;color:var(--purple);text-transform:uppercase;margin-bottom:0.8rem;}
.hero h1{font-family:'Noto Serif KR',serif;font-size:clamp(22px,4vw,32px);font-weight:700;line-height:1.3;margin-bottom:0.8rem;}
.hero p{color:var(--muted);font-size:13px;}
.main{max-width:760px;margin:0 auto;padding:2rem;}

/* 글쓰기 폼 */
.write-box{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1.8rem 2rem;margin-bottom:2.5rem;}
.write-box h2{font-family:'Noto Serif KR',serif;font-size:1rem;font-weight:600;margin-bottom:1.2rem;color:var(--text);}
.form-row{display:flex;gap:0.8rem;margin-bottom:0.8rem;}
.form-input{
  flex:1;background:var(--bg);border:1px solid var(--border);border-radius:4px;
  padding:0.6rem 1rem;color:var(--text);font-family:'Noto Sans KR',sans-serif;
  font-size:14px;font-weight:300;outline:none;transition:border-color 0.2s;
}
.form-input:focus{border-color:var(--accent);}
.form-input::placeholder{color:var(--muted);}
.form-textarea{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:4px;
  padding:0.8rem 1rem;color:var(--text);font-family:'Noto Sans KR',sans-serif;
  font-size:14px;font-weight:300;outline:none;resize:vertical;min-height:100px;
  transition:border-color 0.2s;line-height:1.7;
}
.form-textarea:focus{border-color:var(--accent);}
.form-textarea::placeholder{color:var(--muted);}
.form-bottom{display:flex;justify-content:flex-end;margin-top:0.8rem;}
.btn-submit{
  background:var(--accent);color:#0d1117;border:none;border-radius:4px;
  padding:0.55rem 1.4rem;font-size:13px;font-weight:500;cursor:pointer;
  font-family:'Noto Sans KR',sans-serif;transition:opacity 0.2s;
}
.btn-submit:hover{opacity:0.85;}
.btn-submit:disabled{opacity:0.45;cursor:not-allowed;}
.msg{font-size:12px;margin-top:0.6rem;padding:0.5rem 0.8rem;border-radius:4px;display:none;}
.msg.ok{background:rgba(63,185,80,0.12);color:var(--green);border:1px solid rgba(63,185,80,0.3);}
.msg.err{background:rgba(218,70,70,0.12);color:#f85149;border:1px solid rgba(248,81,73,0.3);}

/* 방명록 목록 */
.entries-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.entries-head h2{font-family:'Noto Serif KR',serif;font-size:1rem;font-weight:600;}
.entry-count{font-size:12px;color:var(--muted);}
.entry-list{display:flex;flex-direction:column;gap:1rem;}
.entry-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.2rem 1.4rem;}
.entry-meta{display:flex;align-items:center;gap:0.7rem;margin-bottom:0.5rem;}
.entry-name{font-size:13px;font-weight:500;color:var(--accent);}
.entry-date{font-size:11px;color:var(--muted);}
.entry-body{font-size:14px;color:var(--text);line-height:1.75;white-space:pre-wrap;word-break:keep-all;}
.loading{text-align:center;padding:3rem;color:var(--muted);font-size:13px;}
.empty{text-align:center;padding:3rem;color:var(--muted);font-size:13px;}

/* 설정 안내 배너 (연결 전) */
.setup-banner{background:rgba(188,140,255,0.08);border:1px solid rgba(188,140,255,0.25);border-radius:10px;padding:1.2rem 1.4rem;margin-bottom:1.5rem;display:none;}
.setup-banner p{font-size:13px;color:var(--muted);line-height:1.7;}
.setup-banner a{color:var(--purple);}

footer{border-top:1px solid var(--border);padding:2rem;text-align:center;font-size:11px;color:var(--muted);letter-spacing:0.04em;margin-top:3rem;}
@media(max-width:600px){.main{padding:1rem;}.write-box{padding:1.2rem;}.form-row{flex-direction:column;}}
</style>
</head>
<body>

<header class="site-header">
  <div class="logo">최승환 · 방명록</div>
  <nav class="nav-links">
    <a href="/">← 홈으로</a>
    <a href="/column.html">칼럼</a>
    <a href="/about.html">소개</a>
  </nav>
  <button id="theme-toggle" onclick="toggleTheme()">&#9790; 다크</button>
</header>

<section class="hero">
  <div class="hero-label">Guestbook</div>
  <h1>방명록</h1>
  <p>들러주셔서 감사합니다. 짧은 인사라도 남겨주시면 반갑겠습니다.</p>
</section>

<main class="main">

  <div class="setup-banner" id="setupBanner">
    <p>⚠️ <strong>Supabase 연결 필요</strong> — 아래 <code>SUPABASE_URL</code>과 <code>SUPABASE_ANON_KEY</code>를 설정하면 방명록이 활성화됩니다.<br>
    <a href="https://supabase.com" target="_blank">supabase.com</a>에서 무료 프로젝트를 만들고, Project Settings → API에서 값을 복사하세요.</p>
  </div>

  <!-- 글쓰기 -->
  <div class="write-box">
    <h2>✍️ 글 남기기</h2>
    <div class="form-row">
      <input class="form-input" id="gbName" type="text" placeholder="이름 (닉네임 가능)" maxlength="30">
    </div>
    <textarea class="form-textarea" id="gbContent" placeholder="자유롭게 인사 남겨주세요 :)" maxlength="500"></textarea>
    <div class="form-bottom">
      <button class="btn-submit" id="gbSubmit" onclick="submitEntry()">등록</button>
    </div>
    <div class="msg" id="gbMsg"></div>
  </div>

  <!-- 목록 -->
  <div class="entries-head">
    <h2>📋 방명록 목록</h2>
    <span class="entry-count" id="entryCount"></span>
  </div>
  <div class="entry-list" id="entryList">
    <div class="loading">불러오는 중...</div>
  </div>

</main>

<footer>© 2026 최승환 · choijc79.github.io</footer>

<script>
// ─────────────────────────────────────────────
// ① 아래 두 값을 Supabase 프로젝트 설정에서 복사해 넣으세요.
//    Project Settings → API → Project URL / anon public key
// ─────────────────────────────────────────────
const SUPABASE_URL  = 'https://rekgsoaaikqfeiychvvb.supabase.co';
const SUPABASE_ANON = 'sb_publishable_aGi06uKppr4VbjQ4Ul16XQ_DuQEOiv6';
// ─────────────────────────────────────────────

const configured = !SUPABASE_URL.startsWith('YOUR');

if (!configured) {
  document.getElementById('setupBanner').style.display = 'block';
  document.getElementById('entryList').innerHTML = '<div class="empty">Supabase 연결 후 방명록이 표시됩니다.</div>';
  document.getElementById('gbSubmit').disabled = true;
} else {
  loadEntries();
}

async function sbFetch(path, opts = {}) {
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...opts,
    headers: {
      'apikey': SUPABASE_ANON,
      'Authorization': 'Bearer ' + SUPABASE_ANON,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || '',
      ...opts.headers
    }
  });
  return res;
}

async function loadEntries() {
  try {
    const res = await sbFetch('guestbook?select=id,name,content,created_at&order=created_at.desc&limit=100');
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    renderEntries(data);
  } catch (e) {
    document.getElementById('entryList').innerHTML = '<div class="empty">불러오기 실패: ' + e.message + '</div>';
  }
}

function renderEntries(data) {
  const list = document.getElementById('entryList');
  document.getElementById('entryCount').textContent = '총 ' + data.length + '개';
  if (!data.length) {
    list.innerHTML = '<div class="empty">아직 방명록이 비어있습니다. 첫 번째 글을 남겨보세요!</div>';
    return;
  }
  list.innerHTML = data.map(e => {
    const d = new Date(e.created_at);
    const date = d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
    const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    return `<div class="entry-card">
      <div class="entry-meta">
        <span class="entry-name">${esc(e.name)}</span>
        <span class="entry-date">${date}</span>
      </div>
      <div class="entry-body">${esc(e.content)}</div>
    </div>`;
  }).join('');
}

async function submitEntry() {
  const name    = document.getElementById('gbName').value.trim();
  const content = document.getElementById('gbContent').value.trim();
  const msg     = document.getElementById('gbMsg');
  const btn     = document.getElementById('gbSubmit');

  if (!name)    { showMsg('이름을 입력해주세요.', 'err'); return; }
  if (!content) { showMsg('내용을 입력해주세요.', 'err'); return; }
  if (content.length > 500) { showMsg('500자 이내로 작성해주세요.', 'err'); return; }

  btn.disabled = true;
  btn.textContent = '등록 중...';

  try {
    const res = await sbFetch('guestbook', {
      method: 'POST',
      prefer: 'return=minimal',
      body: JSON.stringify({ name, content })
    });
    if (!res.ok) throw new Error(await res.text());
    document.getElementById('gbName').value = '';
    document.getElementById('gbContent').value = '';
    showMsg('등록되었습니다 :)', 'ok');
    await loadEntries();
  } catch (e) {
    showMsg('등록 실패: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = '등록';
  }
}

function showMsg(text, type) {
  const msg = document.getElementById('gbMsg');
  msg.textContent = text;
  msg.className = 'msg ' + type;
  msg.style.display = 'block';
  setTimeout(() => { msg.style.display = 'none'; }, 4000);
}
</script>

</body>
</html>
