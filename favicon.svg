<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 사이트 아이콘: 1979 라운지의 붉은 벽돌 벽과 황동 펜던트 조명 -->
  <defs>
    <pattern id="br" width="22" height="11" patternUnits="userSpaceOnUse" x="-3" y="2">
      <rect width="22" height="11" fill="#7a3a27"/>
      <path d="M0 0.6H22M0 6.1H22M11 0.6V5.6M0 6.1V11M22 6.1V11" stroke="#3a1a12" stroke-width="1.2"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="72%" r="58%">
      <stop offset="0" stop-color="#ffd283" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#f0a64a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f0a64a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" x2="1">
      <stop offset="0" stop-color="#8a5f22"/><stop offset=".45" stop-color="#f3d998"/><stop offset="1" stop-color="#7d551e"/>
    </linearGradient>
    <clipPath id="c"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="64" height="64" fill="url(#br)"/>
    <rect width="64" height="64" fill="#140b07" fill-opacity=".35"/>
    <ellipse cx="32" cy="50" rx="34" ry="24" fill="url(#glow)"/>
    <path d="M32 0V15" stroke="#14100d" stroke-width="2"/>
    <rect x="29" y="13" width="6" height="4" rx="1" fill="#6e4a1c"/>
    <path d="M12 39 Q12 16.5 32 16.5 Q52 16.5 52 39 Z" fill="url(#brass)"/>
    <ellipse cx="32" cy="39" rx="20" ry="3.4" fill="#fff0c8"/>
  </g>
</svg>
