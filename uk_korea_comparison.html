        }

            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-main);

            cursor: pointer;
            font-size: 0.88rem;

            color: var(--text-muted);

            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;

            justify-content: space-between;
            align-items: center;

            font-weight: 700;

            text-align: left;

            font-weight: 600;
            color: var(--text-main);

            background-color: #fefce855;
        }

            color: var(--korea-text);

</head>

</div>

            desc: "팀 버너스리가 CERN 근무 당시 HTTP, HTML, URL을 고안하여 인터넷 대중화 기반 구축.",
            krEra: "대한민국 (노태우 정부)",
            krDesc: "해외여행 전면 자유화 시행 및 북방정책(동유럽 수교) 추진."
        },
        {
            category: "과학·의학·IT",
            year: 1996,
            title: "체세포 복제 포유류 탄생",
            desc: "에든버러 로스린 연구소에서 성체 체세포를 복제한 양 '돌리(Dolly)' 탄생.",
            krEra: "대한민국 (김영삼 정부)",
            krDesc: "경제협력개발기구(OECD) 가입 및 지방자치제 전면 실시(1995) 이듬해."
        },

        // 5. 생활·문화·미디어
        {
            category: "생활·문화·미디어",
            year: 1753,
            title: "근대적 국립 박물관 설립",
            desc: "한스 슬론의 수집품을 기반으로 대영박물관 설립(1759년 일반 무료 공개 시작).",
            krEra: "조선 영조 29년",
            krDesc: "균역법 시행(1750) 직후로 군역의 폐단을 보완하며 민생 안정 도모."
        },
        {
            category: "생활·문화·미디어",
            year: 1796,
            title: "근대적 백화점 개점",
            desc: "더비 지역에 '베네츠(Bennetts)'가 개점하여 정찰제 및 다품목 진열 판매 시작.",
            krEra: "조선 정조 20년",
            krDesc: "수원 화성 완공 및 시전 상인의 금난전권 폐지(신해통공, 1791) 이후 상업 활성화."
        },
        {
            category: "생활·문화·미디어",
            year: 1868,
            title: "최초의 장편 추리소설 출간",
            desc: "윌키 콜린스가 현대 추리소설의 문법을 확립한 '월장석(The Moonstone)' 출간.",
            krEra: "조선 고종 5년",
            krDesc: "흥선대원군 집권기로 경복궁 중건 완료(1868) 및 쇄국정책 유지."
        },
        {
            category: "생활·문화·미디어",
            year: 1922,
            title: "공영 라디오 및 TV 정규 방송",
            desc: "BBC 라디오 정규 방송 시작(1922), 세계 최초 고화질 흑백 TV 정규 방송 개시(1936).",
            krEra: "일제강점기",
            krDesc: "문화통치기 속 물산장려운동 전개 (경성방송국 라디오 방송은 1927년 시작)."
        },

        // 6. 스포츠
        {
            category: "스포츠",
            year: 1744,
            title: "골프 규칙 성문화",
            desc: "스코틀랜드 에든버러 골퍼 협회가 최초의 성문화된 13개 골프 규칙 제정.",
            krEra: "조선 영조 20년",
            krDesc: "탕평책 추진 및 왕실과 국가 전례를 정리한 《속오례의》 간행."
        },
        {
            category: "스포츠",
            year: 1863,
            title: "근대 축구 규칙 제정 및 협회 창설",
            desc: "잉글랜드 축구협회(FA) 창설 및 손을 쓰지 않는 현대 축구 규칙 명문화.",
            krEra: "조선 고종 즉위년",
            krDesc: "철종 승하 후 고종 즉위 및 흥선대원군 섭정 시작."
        },
        {
            category: "스포츠",
            year: 1871,
            title: "럭비 협회 창설 및 규칙 표준화",
            desc: "잉글랜드 럭비풋볼유니온(RFU) 결성 및 세계 최초 럭비 국가대항전 개최.",
            krEra: "조선 고종 8년",
            krDesc: "신미양요 발생 및 전국 각지에 척화비 건립."
        },
        {
            category: "스포츠",
            year: 1877,
            title: "근대 테니스 대회 개최",
            desc: "올잉글랜드 클럽에서 제1회 윔블던 선수권 대회를 개최하며 현대 테니스 규칙 정립.",
            krEra: "조선 고종 14년",
            krDesc: "강화도 조약(1876) 체결 이듬해로 부산항 개항 및 개화 정책 태동기."
        }
    ];

    let currentCategory = "전체";
    let currentSearch = "";
    let currentSort = "default";
    let currentView = "card";

    const contentContainer = document.getElementById("contentContainer");
    const statsText = document.getElementById("statsText");
    const tabBtns = document.querySelectorAll(".tab-btn");
    const sortBtns = document.querySelectorAll("[data-sort]");
    const viewBtns = document.querySelectorAll("[data-view]");
    const searchInput = document.getElementById("searchInput");

    function render() {
        let filtered = ukWorldFirsts.filter(item => {
            const matchCat = currentCategory === "전체" || item.category === currentCategory;
            const query = currentSearch.toLowerCase().trim();
            const matchSearch = !query || 
                item.title.toLowerCase().includes(query) || 
                item.desc.toLowerCase().includes(query) || 
                item.krEra.toLowerCase().includes(query) ||
                item.krDesc.toLowerCase().includes(query) ||
                String(item.year).includes(query) ||
                item.category.toLowerCase().includes(query);
            return matchCat && matchSearch;
        });

        if (currentSort === "asc") {
            filtered = [...filtered].sort((a, b) => a.year - b.year);
        } else if (currentSort === "desc") {
            filtered = [...filtered].sort((a, b) => b.year - a.year);
        }

        statsText.textContent = `총 ${filtered.length}개 항목 표시 중`;

        if (filtered.length === 0) {
            contentContainer.innerHTML = `<div class="empty-state">검색 조건에 일치하는 항목이 없습니다.</div>`;
            return;
        }

        if (currentView === "card") {
            const cardsHtml = filtered.map(item => `
                <article class="card">
                    <div>
                        <div class="card-header">
                            <span class="badge-cat">${item.category}</span>
                            <span class="badge-year">${item.year}년</span>
                        </div>
                        <h3>${item.title}</h3>
                        <p class="uk-desc">${item.desc}</p>
                    </div>
                    <div class="korea-box">
                        <div class="korea-label">🇰🇷 동시대 한국 (${item.krEra})</div>
                        <div class="korea-text">${item.krDesc}</div>
                    </div>
                </article>
            `).join("");
            contentContainer.innerHTML = `<div class="grid">${cardsHtml}</div>`;
        } else {
            const rowsHtml = filtered.map(item => `
                <tr>
                    <td class="col-year">${item.year}년</td>
                    <td class="col-cat"><span class="badge-cat">${item.category}</span></td>
                    <td class="col-title">${item.title}</td>
                    <td class="col-uk">${item.desc}</td>
                    <td class="col-kr"><span class="kr-era">[${item.krEra}]</span> ${item.krDesc}</td>
                </tr>
            `).join("");
            contentContainer.innerHTML = `
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>연도</th>
                                <th>분야</th>
                                <th>영국 세계 최초 항목</th>
                                <th>영국 내용 요약</th>
                                <th>동시대 한국 상황</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rowsHtml}
                        </tbody>
                    </table>
                </div>
            `;
        }
    }

    tabBtns.forEach(btn => {
        btn.addEventListener("click", () => {
            tabBtns.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentCategory = btn.dataset.category;
            render();
        });
    });

    sortBtns.forEach(btn => {
        btn.addEventListener("click", () => {
            sortBtns.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentSort = btn.dataset.sort;
            render();
        });
    });

    viewBtns.forEach(btn => {
        btn.addEventListener("click", () => {
            viewBtns.forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentView = btn.dataset.view;
            render();
        });
    });

    searchInput.addEventListener("input", (e) => {
        currentSearch = e.target.value;
        render();
    });

    render();
</script>

</body>
</html>
