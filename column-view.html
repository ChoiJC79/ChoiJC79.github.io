<!-- Supabase에서 개별 칼럼 데이터를 실시간으로 가져와 마크다운 형식으로 렌더링하는 동적 상세 페이지 -->
<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>칼럼 읽기 — 최승환</title>
<!-- SEO Meta Tags (기본값 설정 후 JS에서 업데이트) -->
<meta name="description" content="최승환의 칼럼 전문을 동적으로 읽어옵니다.">
<meta property="og:title" content="칼럼 — 최승환">
<meta property="og:description" content="최승환의 칼럼 전문을 동적으로 읽어옵니다.">
<meta property="og:type" content="article">
<meta property="og:site_name" content="최승환">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">

<!-- Marked 마크다운 렌더러 라이브러리 CDN 로드 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>
:root{--bg:#0d1117;--surface:#161b22;--border:#30363d;--text:#e6edf3;--ink:#c9d1d9;--muted:#8b949e;--accent:#58a6ff;}
[data-theme="light"]{--bg:#ffffff;--surface:#f6f8fa;--border:#d0d7de;--text:#1f2328;--ink:#24292f;--muted:#656d76;--accent:#0969da;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-weight:300;line-height:1.8;}
a{color:inherit;text-decoration:none;}
header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);}
.hd-inner{max-width:1100px;margin:0 auto;padding:0 2rem;height:52px;display:flex;align-items:center;gap:1.5rem;}
.hd-logo{{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;color:var(--text);letter-spacing:0.04em;}}
.hd-logo{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;color:var(--text);letter-spacing:0.04em;}
.hd-nav{display:flex;gap:1.2rem;flex:1;}
.hd-nav a{font-size:12px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;transition:color 0.15s;}
.hd-nav a:hover{color:var(--accent);}
.hd-back{margin-left:auto;font-size:11px;color:var(--muted);letter-spacing:0.06em;border:1px solid var(--border);padding:0.3rem 0.8rem;transition:all 0.15s;}
.hd-back:hover{border-color:var(--accent);color:var(--accent);}
.theme-btn{background:none;border:1px solid var(--border);color:var(--muted);font-size:11px;font-family:inherit;cursor:pointer;padding:0.3rem 0.7rem;transition:all 0.15s;}
.theme-btn:hover{border-color:var(--accent);color:var(--accent);}

.article-wrap{max-width:720px;margin:0 auto;padding:3rem 2rem 5rem;}
.a-type{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;font-weight:500;color:#d29922;margin-bottom:1rem;}
.a-title{font-family:'Noto Serif KR',serif;font-size:2rem;font-weight:700;line-height:1.35;color:var(--ink);margin-bottom:1.2rem;}
.a-meta{display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap;margin-bottom:2.5rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border);}
.a-date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
.a-tag{font-size:11px;padding:2px 10px;border:1px solid;}
.a-body{font-size:15px;line-height:2;color:var(--ink);min-height:250px;}

/* 마크다운 공통 스타일링 */
.a-body p{margin-bottom:1.6em;text-align:justify;word-break:keep-all;}
.a-body h2, .a-body h3{font-family:'Noto Serif KR',serif;font-weight:700;margin:2em 0 0.8em;color:var(--text);}
.a-body h2{font-size:1.25rem;border-bottom:1px solid var(--border);padding-bottom:0.4rem;}
.a-body h3{font-size:1.05rem;}
.a-body ul{margin:0 0 1.6em 1.5em;}
.a-body li{margin-bottom:0.5em;}
.a-body strong{font-weight:500;color:var(--text);}
.a-body a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;}

.art-nav{max-width:720px;margin:0 auto;padding:2rem 2rem 4rem;display:flex;gap:1rem;border-top:1px solid var(--border);}
.nav-prev, .nav-next{font-size:12px;color:var(--muted);transition:color 0.15s;max-width:45%;display:inline-block;}
.nav-prev:hover, .nav-next:hover{color:var(--accent);}
.nav-next{text-align:right;margin-left:auto;}

.loading{text-align:center;padding:5rem 0;color:var(--muted);font-size:14px;}
.error-box{text-align:center;padding:5rem 0;color:#f85149;}
.error-box h2{font-family:'Noto Serif KR',serif;font-size:1.5rem;margin-bottom:1rem;}
.error-box p{font-size:14px;color:var(--muted);margin-bottom:1.5rem;}
.btn-home{border:1px solid var(--border);padding:0.4rem 1rem;font-size:12px;color:var(--muted);transition:all 0.15s;}
.btn-home:hover{border-color:var(--accent);color:var(--accent);}

footer{border-top:1px solid var(--border);text-align:center;padding:1.5rem 1rem;font-size:11px;color:var(--muted);letter-spacing:0.04em;}
#mqb{display:none;position:fixed;bottom:0;left:0;right:0;z-index:999;background:var(--surface);border-top:1px solid var(--border);padding:0.45rem 0.6rem;gap:0.4rem;justify-content:space-around;}
#mqb a{flex:1;text-align:center;color:var(--muted);font-size:10px;padding:0.4rem 0.2rem;border:1px solid var(--border);line-height:1.4;}
@media(max-width:900px){.hd-nav{display:none;}#mqb{display:flex;}body{padding-bottom:4rem;}}
@media(max-width:600px){.article-wrap{padding:2rem 1.2rem 4rem;}.a-title{font-size:1.5rem;}.a-body{font-size:14px;}.art-nav{padding:1.5rem 1.2rem 3rem;}}
</style>
</head>
<body>
<header>
<div class="hd-inner">
  <a class="hd-logo" href="/">최승환</a>
  <nav class="hd-nav">
    <a href="/about.html">소개</a>
    <a href="/research.html">연구</a>
    <a href="/column.html">칼럼</a>
    <a href="/local.html">제천</a>
  </nav>
  <a class="hd-back" href="/column.html">← 칼럼 목록</a>
  <button class="theme-btn" id="theme-toggle" onclick="toggleTheme()">☀ 라이트</button>
</div>
</header>

<main>
  <div id="contentArea">
    <div class="loading">📡 Supabase에서 칼럼을 불러오는 중...</div>
  </div>
</main>

<footer>© 최승환 · choijc79.github.io</footer>
<div id="mqb">
  <a href="/">🏠 홈</a>
  <a href="/about.html">소개</a>
  <a href="/research.html">연구</a>
  <a href="/column.html">칼럼</a>
  <a href="/local.html">제천</a>
</div>

<script>
// ─── Supabase 연결 정보 (guestbook.html에서 이미 검증 완료) ───
const SUPABASE_URL  = 'https://rekgsoaaikqfeiychvvb.supabase.co';
const SUPABASE_ANON = 'sb_publishable_aGi06uKppr4VbjQ4Ul16XQ_DuQEOiv6';

async function fetchSupabase(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SUPABASE_ANON,
      'Authorization': `Bearer ${SUPABASE_ANON}`,
      'Content-Type': 'application/json'
    }
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// URL에서 슬러그 파라미터 추출 (?slug=...)
const urlParams = new URLSearchParams(window.location.search);
const currentSlug = urlParams.get('slug');

async function initColumn() {
  const area = document.getElementById('contentArea');
  if (!currentSlug) {
    renderError("슬러그가 올바르지 않습니다.");
    return;
  }

  try {
    // 1. 현재 슬러그의 칼럼 정보 및 전체 목록(이전/다음 링크 계산용) 병렬 로드
    const [colsData, allCols] = await Promise.all([
      fetchSupabase(`columns?slug=eq.${encodeURIComponent(currentSlug)}&limit=1`),
      fetchSupabase(`columns?select=slug,title&order=date.desc`)
    ]);

    if (!colsData || colsData.length === 0) {
      renderError("해당 칼럼을 찾을 수 없습니다.");
      return;
    }

    const col = colsData[0];
    
    // 2. SEO 메타 및 타이틀 업데이트
    document.title = `${col.title} — 최승환`;
    const plainTextBody = col.body.replace(/[\*#_`~-\[\]()]/g, '').substring(0, 110) + '...';
    document.querySelector('meta[name="description"]')?.setAttribute('content', plainTextBody);
    document.querySelector('meta[property="og:title"]')?.setAttribute('content', col.title);
    document.querySelector('meta[property="og:description"]')?.setAttribute('content', plainTextBody);

    // 3. 이전/다음 칼럼 계산
    const currIdx = allCols.findIndex(item => item.slug === currentSlug);
    const prevCol = currIdx !== -1 && currIdx + 1 < allCols.length ? allCols[currIdx + 1] : null;
    const nextCol = currIdx > 0 ? allCols[currIdx - 1] : null;

    // 4. 스타일 및 태그 칩 생성
    const isLife = col.type === 'life';
    const typeLabel = isLife ? '삶의 기록' : '행정·정책';
    const typeColor = isLife ? '#3fb950' : '#d29922';

    const tagsHtml = col.tags.map(t => 
      `<span class="a-tag" style="border-color:${typeColor}44;color:${typeColor}">${t}</span>`
    ).join('');

    // 5. 마크다운 바디 파싱 (marked.js 사용)
    const renderedBody = marked.parse(col.body);

    // 6. 이전/다음 네비게이션 링크 생성
    let navHtml = '';
    if (prevCol || nextCol) {
      const prevLink = prevCol ? `<a class="nav-prev" href="/column-view.html?slug=${prevCol.slug}">← ${escapeHtml(truncate(prevCol.title, 30))}</a>` : '';
      const nextLink = nextCol ? `<a class="nav-next" href="/column-view.html?slug=${nextCol.slug}">${escapeHtml(truncate(nextCol.title, 30))} →</a>` : '';
      navHtml = `
        <nav class="art-nav">
          ${prevLink}
          ${nextLink}
        </nav>
      `;
    }

    // 7. 메인 화면 렌더링
    area.innerHTML = `
      <div class="article-wrap">
        <div class="a-type" style="color:${typeColor}">${typeLabel}</div>
        <h1 class="a-title">${escapeHtml(col.title)}</h1>
        <div class="a-meta">
          <span class="a-date">${col.date}</span>
          ${tagsHtml}
        </div>
        <div class="a-body">
          ${renderedBody}
        </div>
      </div>
      ${navHtml}
    `;

  } catch (error) {
    console.error(error);
    renderError(`불러오기 실패: ${error.message}`);
  }
}

function renderError(message) {
  const area = document.getElementById('contentArea');
  area.innerHTML = `
    <div class="error-box">
      <h2>오류 발생</h2>
      <p>${escapeHtml(message)}</p>
      <a class="btn-home" href="/column.html">칼럼 목록으로 가기</a>
    </div>
  `;
}

// ─── 유틸리티 함수 ───
function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function truncate(str, maxLen) {
  if (!str) return '';
  return str.length > maxLen ? str.substring(0, maxLen) + '…' : str;
}

// ─── 테마 제어 ───
function toggleTheme(){
  var t = document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('choijc-theme',t);
  var b = document.getElementById('theme-toggle');
  if(b) b.textContent = t==='dark'?'☀ 라이트':'🌙 다크';
}

(function(){
  var t = localStorage.getItem('choijc-theme')||'dark';
  document.documentElement.setAttribute('data-theme',t);
  document.addEventListener('DOMContentLoaded', function(){
    var b = document.getElementById('theme-toggle');
    if(b) b.textContent = t==='dark'?'☀ 라이트':'🌙 다크';
  });
}());

// 최초 시작
initColumn();
</script>
</body>
</html>
