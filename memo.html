<!-- Supabase에서 4대 정리노트(아이디어, 목표, 일상, 공부) 데이터를 실시간으로 가져와 동적으로 표시하는 페이지 -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정리노트 | 최승환</title>
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff;
    --green:#3fb950; --orange:#d29922; --purple:#bc8cff;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;line-height:1.7;padding:2rem 1rem;}
  .container{max-width:900px;margin:0 auto;}
  header{text-align:center;margin-bottom:3rem;padding-bottom:2rem;border-bottom:1px solid var(--border);}
  header h1{font-size:1.8rem;font-weight:700;margin-bottom:0.4rem;}
  header p{color:var(--muted);font-size:0.9rem;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;}
  @media(max-width:640px){.grid{grid-template-columns:1fr;}}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.5rem;}
  .card-title{font-size:1.1rem;font-weight:700;margin-bottom:1rem;}
  .card.ideas .card-title{color:var(--orange);}
  .card.goals .card-title{color:var(--green);}
  .card.diary .card-title{color:var(--purple);}
  .card.work  .card-title{color:var(--accent);}
  
  .memo-container{min-height: 100px;}
  .memo-item{padding:0.6rem 0;border-bottom:1px solid var(--border);}
  .memo-item:last-child{border-bottom:none;}
  .date{display:inline-block;font-size:0.75rem;color:var(--muted);background:rgba(139,148,158,0.1);padding:0.1rem 0.5rem;border-radius:20px;margin-right:0.5rem;}
  .text{font-size:0.92rem;}
  .empty{color:var(--muted);font-size:0.9rem;font-style:italic;padding: 1rem 0;text-align: center;}
  footer{text-align:center;margin-top:3rem;padding-top:2rem;border-top:1px solid var(--border);color:var(--muted);font-size:0.82rem;}
  a{color:var(--accent);text-decoration:none;}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📋 나를 정리하는 프로젝트</h1>
    <p>최승환 · 지방행정 연구자 · 제천시청 팀장 &nbsp;|&nbsp; 실시간 Supabase 연동 완료</p>
    <p style="margin-top:0.5rem"><a href="/">← 홈으로</a></p>
  </header>
  
  <div class="grid">
    <!-- 아이디어 · 기획 -->
    <div class="card ideas">
      <div class="card-title">💡 아이디어 · 기획</div>
      <div class="memo-container" id="memo-ideas">
        <div class="empty">로딩 중...</div>
      </div>
    </div>
    
    <!-- 목표 · 계획 · 다짐 -->
    <div class="card goals">
      <div class="card-title">🎯 목표 · 계획 · 다짐</div>
      <div class="memo-container" id="memo-goals">
        <div class="empty">로딩 중...</div>
      </div>
    </div>
    
    <!-- 일상 · 감정 · 회고 -->
    <div class="card diary">
      <div class="card-title">📖 일상 · 감정 · 회고</div>
      <div class="memo-container" id="memo-diary">
        <div class="empty">로딩 중...</div>
      </div>
    </div>
    
    <!-- 업무 · 논문 · 공부 -->
    <div class="card work">
      <div class="card-title">📚 업무 · 논문 · 공부</div>
      <div class="memo-container" id="memo-work">
        <div class="empty">로딩 중...</div>
      </div>
    </div>
  </div>
  
  <footer>
    <p>Claude와 함께 정리하는 나의 기록 &nbsp;·&nbsp; <a href="https://choijc79.github.io">choijc79.github.io</a></p>
  </footer>
</div>

<script>
// ─── Supabase 연결 정보 ───
const SUPABASE_URL  = 'https://rekgsoaaikqfeiychvvb.supabase.co';
const SUPABASE_ANON = 'sb_publishable_aGi06uKppr4VbjQ4Ul16XQ_DuQEOiv6';

async function fetchSupabase(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SUPABASE_ANON,
      'Authorization': `Bearer ${SUPABASE_ANON}`,
      'Content-Type': 'application/json'
    }
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function loadMemos() {
  try {
    // 1. Supabase에서 최신순으로 모든 정리노트 가져오기
    const memos = await fetchSupabase('memos?order=date.desc');
    
    // 2. 카테고리별로 그룹화
    const categorized = {
      ideas: [],
      goals: [],
      diary: [],
      work: []
    };
    
    memos.forEach(m => {
      if (categorized[m.category]) {
        categorized[m.category].push(m);
      }
    });
    
    // 3. 각 카드에 최신 30개 항목 그리기
    renderCategory('ideas', categorized.ideas.slice(0, 30));
    renderCategory('goals', categorized.goals.slice(0, 30));
    renderCategory('diary', categorized.diary.slice(0, 30));
    renderCategory('work', categorized.work.slice(0, 30));
    
  } catch (e) {
    console.error(e);
    const errorHtml = `<div class="empty" style="color: #f85149;">로딩 실패: ${e.message}</div>`;
    document.getElementById('memo-ideas').innerHTML = errorHtml;
    document.getElementById('memo-goals').innerHTML = errorHtml;
    document.getElementById('memo-diary').innerHTML = errorHtml;
    document.getElementById('memo-work').innerHTML = errorHtml;
  }
}

function renderCategory(catId, items) {
  const container = document.getElementById(`memo-${catId}`);
  if (!items || items.length === 0) {
    container.innerHTML = `<div class="empty">아직 기록이 없습니다.</div>`;
    return;
  }
  
  container.innerHTML = items.map(item => {
    // 마크다운 볼드체(**텍스트**)를 <strong>텍스트</strong>로 변환
    let text = escapeHtml(item.content);
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    
    return `
      <div class="memo-item">
        <span class="date">${item.date}</span>
        <span class="text">${text}</span>
      </div>
    `;
  }).join('');
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

// 초기 로딩 실행
loadMemos();
</script>
</body>
</html>
